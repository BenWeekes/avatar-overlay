<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar Providers</title>
<style>
  :root{color-scheme:dark;}*{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:#0d0d0f;height:100vh;display:flex;flex-direction:column;overflow:hidden;
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  .bar{padding:8px;display:flex;justify-content:center;gap:10px;flex:0 0 auto;}
  .bar button{border:0;border-radius:8px;padding:9px 20px;font-weight:600;font-size:14px;cursor:pointer;background:#fff;color:#111;}
  .grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:0 8px 8px;}
  .cell{position:relative;background:#000;border-radius:10px;overflow:hidden;display:grid;place-items:center;min-height:0;min-width:0;}
  .cell video{max-width:100%;max-height:100%;object-fit:contain;background:#000;}
  .tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:6px;font-size:13px;font-weight:600;color:#fff;pointer-events:none;z-index:2;}
  .open{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.9);color:#111;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none;z-index:2;}
</style>
</head>
<body>
  <div class="bar"><button id="restart">Restart All</button></div>
  <div class="grid">
    <div class="cell"><span class="tag">Tavus</span><a class="open" href="/avatar-overlay/avatar.html?p=tavus">Open</a><video data-k="tavus" src="/avatar-overlay/grid-tavus.mp4" muted loop playsinline controls preload="auto"></video></div>
    <div class="cell"><span class="tag">LemonSlice</span><a class="open" href="/avatar-overlay/avatar.html?p=lemon">Open</a><video data-k="lemon" src="/avatar-overlay/grid-lemon.mp4" muted loop playsinline controls preload="auto"></video></div>
    <div class="cell"><span class="tag">Anam</span><a class="open" href="/avatar-overlay/avatar.html?p=anam">Open</a><video data-k="anam" src="/avatar-overlay/grid-anam.mp4" muted loop playsinline controls preload="auto"></video></div>
    <div class="cell"><span class="tag">Protoface</span><a class="open" href="/avatar-overlay/avatar.html?p=proto">Open</a><video data-k="proto" src="/avatar-overlay/grid-proto.mp4" muted loop playsinline controls preload="auto"></video></div>
  </div>
<script>
  // Muted by default; the user unmutes any tile with its native controls.
  // "Restart All" seeks every clip back to 0 and starts them together, in sync.
  const vids=[...document.querySelectorAll('video')];
  function restart(){ vids.forEach(v=>{try{v.pause();v.currentTime=0;}catch(e){}});
    requestAnimationFrame(()=>requestAnimationFrame(()=>vids.forEach(v=>v.play().catch(()=>{})))); }
  let ready=0; vids.forEach(v=>v.addEventListener('canplaythrough',()=>{ if(++ready===vids.length) restart(); },{once:true}));
  setTimeout(()=>{ if(ready<vids.length) restart(); },4000);
  document.getElementById('restart').onclick=restart;
</script>
</body>
</html>
