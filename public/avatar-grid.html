<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar Providers</title>
<style>
  :root{color-scheme:dark;}*{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:#0d0d0f;height:100vh;display:flex;flex-direction:column;overflow:hidden;
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  .bar{padding:8px;display:flex;justify-content:center;gap:10px;flex:0 0 auto;}
  .bar button{border:0;border-radius:8px;padding:9px 20px;font-weight:600;font-size:14px;cursor:pointer;background:#fff;color:#111;}
  .grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:0 8px 8px;}
  .cell{position:relative;background:#000;border-radius:10px;overflow:hidden;display:grid;place-items:center;min-height:0;min-width:0;cursor:pointer;text-decoration:none;}
  .cell video{max-width:100%;max-height:100%;object-fit:contain;background:#000;pointer-events:none;}
  .tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:6px;font-size:13px;font-weight:600;color:#fff;pointer-events:none;z-index:2;}
</style>
</head>
<body>
  <div class="bar"><button id="restart">Restart All</button></div>
  <div class="grid">
    <a class="cell" href="/avatar-overlay/avatar.html?p=tavus"><span class="tag">Tavus</span><video data-k="tavus" src="/avatar-overlay/grid-tavus.mp4" muted loop playsinline preload="auto"></video></a>
    <a class="cell" href="/avatar-overlay/avatar.html?p=lemon"><span class="tag">LemonSlice</span><video data-k="lemon" src="/avatar-overlay/grid-lemon.mp4" muted loop playsinline preload="auto"></video></a>
    <a class="cell" href="/avatar-overlay/avatar.html?p=anam"><span class="tag">Anam</span><video data-k="anam" src="/avatar-overlay/grid-anam.mp4" muted loop playsinline preload="auto"></video></a>
    <a class="cell" href="/avatar-overlay/avatar.html?p=proto"><span class="tag">Protoface</span><video data-k="proto" src="/avatar-overlay/grid-proto.mp4" muted loop playsinline preload="auto"></video></a>
  </div>
<script>
  // Tiles are muted silent previews; click any cell to open that provider's video
  // (unmuted, with native controls). "Restart All" re-syncs every tile from 0.
  const vids=[...document.querySelectorAll('video')];
  function restart(){ vids.forEach(v=>{try{v.pause();v.currentTime=0;}catch(e){}});
    requestAnimationFrame(()=>requestAnimationFrame(()=>vids.forEach(v=>v.play().catch(()=>{})))); }
  let ready=0; vids.forEach(v=>v.addEventListener('canplaythrough',()=>{ if(++ready===vids.length) restart(); },{once:true}));
  setTimeout(()=>{ if(ready<vids.length) restart(); },4000);
  document.getElementById('restart').onclick=restart;
</script>
</body>
</html>
