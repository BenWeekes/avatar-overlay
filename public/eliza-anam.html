<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eliza — Video Profile</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #111; }
  body { display: grid; place-items: center; min-height: 100vh; }
  /* tile: keep the video's own aspect ratio, never stretch */
  video { display: block; width: auto; height: auto;
          max-width: min(1100px, 96vw); max-height: 90vh; border-radius: 12px; }
  .unmute { position: fixed; top: 14px; right: 14px; z-index: 2;
            padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer;
            font: 600 15px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: #fff; color: #111; }
  .unmute.hidden { display: none; }
</style>
</head>
<body>
  <video id="v" src="/avatar-overlay/eliza-anam-dating.mp4" autoplay muted loop playsinline preload="auto"></video>
  <button class="unmute" id="unmute">Unmute</button>
<script>
  const v = document.getElementById('v');
  const b = document.getElementById('unmute');
  v.play().catch(() => {});
  b.addEventListener('click', () => {
    v.muted = false; v.volume = 1; v.play().catch(() => {});
    b.classList.add('hidden');
  });
</script>
</body>
</html>
